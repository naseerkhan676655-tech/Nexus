name: Build & CDN Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p deploy
          cp app/build/outputs/apk/debug/app-debug.apk deploy/Nexus.apk
          echo "Build: ${{ github.run_number }}" > deploy/version.txt
          echo "Date: $(date -u)" >> deploy/version.txt

      - name: Push to CDN branch
        run: |
          cd deploy
          git init
          git checkout -b cdn
          git config user.name "Nexus Bot"
          git config user.email "bot@nexus.local"
          git add .
          git commit -m "Build #${{ github.run_number }}"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git cdn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Nexus v1.0.${{ github.run_number }}
          files: deploy/Nexus.apk
          draft: false
