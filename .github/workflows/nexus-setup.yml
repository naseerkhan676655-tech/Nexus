          fun vib(ctx: Context, ms: Long) {
              val v = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S)
                  (ctx.getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager).defaultVibrator
              else @Suppress("DEPRECATION") ctx.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                  v.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE))
              else @Suppress("DEPRECATION") v.vibrate(ms)
          }

          fun notif(ctx: Context, t: String, b: String) {
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU &&
                  ContextCompat.checkSelfPermission(ctx, Manifest.permission.POST_NOTIFICATIONS)
                  != PackageManager.PERMISSION_GRANTED) return
              val nm = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
              nm.notify(System.currentTimeMillis().toInt(), NotificationCompat.Builder(ctx, "nexus")
                  .setSmallIcon(android.R.drawable.ic_dialog_info).setContentTitle(t).setContentText(b)
                  .setAutoCancel(true).build())
          }

          fun locS(ctx: Context): String {
              if (ContextCompat.checkSelfPermission(ctx, Manifest.permission.ACCESS_FINE_LOCATION)
                  != PackageManager.PERMISSION_GRANTED) return "✗ No perm"
              val lm = ctx.getSystemService(Context.LOCATION_SERVICE) as LocationManager
              val l = lm.getLastKnownLocation(LocationManager.GPS_PROVIDER)
                  ?: lm.getLastKnownLocation(LocationManager.NETWORK_PROVIDER)
              return if (l == null) "⏳ No loc" else "📍 ${l.latitude}, ${l.longitude}"
          }

          fun tFlash(ctx: Context): String {
              return try {
                  val cm = ctx.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                  val id = cm.cameraIdList.firstOrNull { c ->
                      cm.getCameraCharacteristics(c)
                          .get(android.hardware.camera2.CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                  } ?: return "✗ No flash"
                  FlashState.on = !FlashState.on
                  cm.setTorchMode(id, FlashState.on)
                  if (FlashState.on) "✓ Flash ON" else "✓ Flash OFF"
              } catch (e: Exception) { "✗ ${e.message}" }
          }

