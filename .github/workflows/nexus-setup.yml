          suspend fun gq(k: String, m: String): String = withContext(Dispatchers.IO) {
              try {
                  val u = URL("https://api.groq.com/openai/v1/chat/completions")
                  val c = u.openConnection() as HttpURLConnection
                  c.requestMethod = "POST"
                  c.setRequestProperty("Content-Type", "application/json")
                  c.setRequestProperty("Authorization", "Bearer $k")
                  c.connectTimeout = 30000; c.readTimeout = 30000; c.doOutput = true
                  val e = m.replace("\\", "\\\\").replace("\"", "\\\"").replace("\n", "\\n")
                  val b = "{\"model\":\"llama-3.1-8b-instant\",\"messages\":[{\"role\":\"system\",\"content\":\"You are Nexus. Reply short in Roman Urdu/English.\"},{\"role\":\"user\",\"content\":\"$e\"}],\"temperature\":0.7}"
                  OutputStreamWriter(c.outputStream).use { it.write(b) }
                  val rc = c.responseCode
                  if (rc != 200) { val er = c.errorStream?.bufferedReader()?.readText() ?: ""
                      return@withContext "Error $rc\n${er.take(150)}" }
                  val r = BufferedReader(InputStreamReader(c.inputStream)).readText()
                  c.disconnect()
                  JSONObject(r).getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content")
              } catch (e: Exception) { "Error: ${e.message}" }
          }
          MAIN_EOF

      - name: Write build workflow
        run: |
          cat > .github/workflows/build-apk.yml << 'BW_EOF'
          name: Build APK to CDN
          on:
            push: { branches: [ main ] }
            workflow_dispatch:
          permissions: { contents: write }
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with: { distribution: 'temurin', java-version: '17' }
                - uses: gradle/actions/setup-gradle@v4
                  with: { gradle-version: 8.5 }
                - run: gradle assembleDebug --no-daemon
                - name: Prepare APK
                  run: |
                    mkdir -p deploy
                    cp app/build/outputs/apk/debug/app-debug.apk deploy/Nexus.apk
                - name: Push to CDN branch
                  run: |
                    cd deploy
                    git init
                    git checkout -b cdn
                    git config user.name "Nexus Bot"
                    git config user.email "bot@nexus.local"
                    git add .
                    git commit -m "Build ${{ github.run_number }}"
                    git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git cdn
          BW_EOF

      - name: Commit and push
        run: |
          git add -A
          git commit -m "Auto-setup v0.4: All tools + Screenshot + Video" || echo "No changes"
          git push
