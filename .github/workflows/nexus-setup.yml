          fun lDir(ctx: Context, d: String): String = try {
              val dir = Environment.getExternalStoragePublicDirectory(d)
              if (dir == null || !dir.exists()) return "📂 Empty"
              val f = dir.listFiles() ?: return "📂 Empty"
              if (f.isEmpty()) return "📂 Empty"
              val s = StringBuilder("📂 $d (${f.size})\n\n")
              f.sortedByDescending { it.lastModified() }.take(20).forEach { x ->
                  s.appendLine("• ${x.name}${if (x.isFile) " (${x.length()/1024}KB)" else "/"}")
              }
              s.toString()
          } catch (e: Exception) { "✗ ${e.message}" }

