          fun runT(ctx: Context, t: String): String {
              return try {
                  when (t) {
                      "📳 Vibrate" -> { vib(ctx, 1000); "✓ Vibrate" }
                      "💬 Toast" -> { Toast.makeText(ctx, "Hello!", Toast.LENGTH_LONG).show(); "✓ Toast" }
                      "🔔 Notify" -> { notif(ctx, "Nexus", "Test"); "✓ Notif" }
                      "🔊 Ring" -> { val u = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                          ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)
                          RingtoneManager.getRingtone(ctx, u).play(); "✓ Ring" }
                      "📍 Location" -> locS(ctx)
                      "📋 Clipboard" -> { val cb = ctx.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          val c = cb.primaryClip
                          if (c == null || c.itemCount == 0) "📋 Empty" else "📋 ${c.getItemAt(0).coerceToText(ctx)}" }
                      "🔦 Flash" -> tFlash(ctx)
                      "🔊 Vol Max" -> { val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          am.setStreamVolume(AudioManager.STREAM_MUSIC, am.getStreamMaxVolume(AudioManager.STREAM_MUSIC), 0); "✓ Max" }
                      "🔇 Vol Mute" -> { val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_MUTE, 0); "✓ Muted" }
                      "☀️ Bright Max" -> sBr(ctx, 255)
                      "🌙 Bright Min" -> sBr(ctx, 10)
                      else -> "?"
                  }
              } catch (e: Exception) { "✗ ${e.message}" }
          }

          fun sBr(ctx: Context, v: Int): String = try {
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                  if (!Settings.System.canWrite(ctx)) {
                      val i = Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS)
                      i.data = Uri.parse("package:${ctx.packageName}")
                      ctx.startActivity(i)
                      "⚠️ Allow 'Modify system settings'"
                  } else { Settings.System.putInt(ctx.contentResolver, Settings.System.SCREEN_BRIGHTNESS, v); "✓ Set" }
              } else "⚠️ Not supported"
          } catch (e: Exception) { "✗ ${e.message}" }

