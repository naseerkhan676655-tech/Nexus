          fun devInfo(ctx: Context): String {
              val s = StringBuilder()
              s.appendLine("📱 DEVICE")
              s.appendLine("Model: ${Build.MANUFACTURER} ${Build.MODEL}")
              s.appendLine("Android: ${Build.VERSION.RELEASE} (API ${Build.VERSION.SDK_INT})")
              s.appendLine()
              val bm = ctx.getSystemService(Context.BATTERY_SERVICE) as BatteryManager
              val lvl = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
              val bi = ctx.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
              val st = bi?.getIntExtra(BatteryManager.EXTRA_STATUS, -1) ?: -1
              val ch = st == BatteryManager.BATTERY_STATUS_CHARGING || st == BatteryManager.BATTERY_STATUS_FULL
              val tp = (bi?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) ?: 0) / 10.0
              s.appendLine("🔋 BATTERY")
              s.appendLine("Level: $lvl%")
              s.appendLine("Status: ${if (ch) "Charging" else "Not"}")
              s.appendLine("Temp: $tp°C")
              s.appendLine()
              val am = ctx.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
              val mi = ActivityManager.MemoryInfo(); am.getMemoryInfo(mi)
              val tR = mi.totalMem / (1024.0 * 1024 * 1024)
              val uR = (mi.totalMem - mi.availMem) / (1024.0 * 1024 * 1024)
              s.appendLine("🧠 RAM: ${"%.2f".format(uR)} / ${"%.2f".format(tR)} GB")
              s.appendLine()
              try {
                  val st2 = StatFs(Environment.getDataDirectory().path)
                  val tot = st2.blockCountLong * st2.blockSizeLong / (1024.0 * 1024 * 1024)
                  val av = st2.availableBlocksLong * st2.blockSizeLong / (1024.0 * 1024 * 1024)
                  s.appendLine("💾 STORAGE")
                  s.appendLine("Used: ${"%.2f".format(tot - av)} / ${"%.2f".format(tot)} GB")
                  s.appendLine("Free: ${"%.2f".format(av)} GB")
                  s.appendLine()
              } catch (_: Exception) {}
              val cm = ctx.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
              val nc = cm.getNetworkCapabilities(cm.activeNetwork)
              val t = when {
                  nc == null -> "None"
                  nc.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) -> "WiFi"
                  nc.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR) -> "Mobile"
                  else -> "Other"
              }
              s.appendLine("📶 NETWORK: $t")
              if (t == "WiFi") try {
                  val wm = ctx.applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                  val ip = wm.connectionInfo.ipAddress
                  s.appendLine("IP: ${ip and 0xff}.${(ip shr 8) and 0xff}.${(ip shr 16) and 0xff}.${(ip shr 24) and 0xff}")
              } catch (_: Exception) {}
              return s.toString()
          }

